  <g id="text_19">
   <text style="fill: #68737d; font: 6.5px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(15.552 235.68375)">32 paired training-seed blocks; error bars are paired block-bootstrap 95% CIs. The primary hidden-reversal contrast favored action-only.</text>
   <text style="fill: #68737d; font: 6.5px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(15.552 242.729953)">Synthetic post-actuator sign is not the worm premotor RIM→AIY signal; outcome-informed test, not biological-transfer validation.</text>
  </g>
