   <g id="text_1">
    <text style="fill: #2864a5; font: 700 8.2px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start" x="20.3472" y="52.747354" transform="rotate(-0 20.3472 52.747354)">Evidence question</text>
   </g>
   <g id="text_2">
    <text style="fill: #2864a5; font: 700 8.2px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start" x="188.80128" y="52.747354" transform="rotate(-0 188.80128 52.747354)">Record-level status</text>
   </g>
   <g id="text_3">
    <text style="fill: #2864a5; font: 700 8.2px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start" x="369.82656" y="52.74351" transform="rotate(-0 369.82656 52.74351)">Inference ceiling</text>
   </g>
   <g id="text_4">
    <text style="fill: #202a33; font: 7px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(20.3472 79.656325)">Connectome structure → task</text>
    <text style="fill: #202a33; font: 7px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(20.3472 86.809614)">computation</text>
   </g>
   <g id="text_5">
    <text style="fill: #202a33; font: 7px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(188.80128 76.038665)">Bounded M0 result; Fish1.5 directional</text>
    <text style="fill: #202a33; font: 7px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(188.80128 83.191954)">association not supported; topology null</text>
    <text style="fill: #202a33; font: 7px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(188.80128 90.427274)">indeterminate</text>
   </g>
   <g id="text_6">
    <text style="fill: #202a33; font: 7px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start" x="369.82656" y="83.23461" transform="rotate(-0 369.82656 83.23461)">Frozen assay / one specimen</text>
   </g>
   <g id="text_7">
    <text style="fill: #202a33; font: 7px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(20.3472 115.30415)">Biological computation in source</text>
    <text style="fill: #202a33; font: 7px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(20.3472 122.53947)">system</text>
   </g>
   <g id="text_8">
    <text style="fill: #202a33; font: 7px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(188.80128 115.30415)">Published worm evidence; animal-level project</text>
    <text style="fill: #202a33; font: 7px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(188.80128 122.53947)">reanalysis blocked by schema</text>
   </g>
   <g id="text_9">
    <text style="fill: #202a33; font: 7px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start" x="369.82656" y="118.962825" transform="rotate(-0 369.82656 118.962825)">Published cell-class scope</text>
   </g>
   <g id="text_10">
    <text style="fill: #202a33; font: 7px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start" x="20.3472" y="154.694322" transform="rotate(-0 20.3472 154.694322)">Cross-system substrate resolution</text>
   </g>
   <g id="text_11">
    <text style="fill: #202a33; font: 7px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(188.80128 151.044396)">R20-01 supports projection-level evidence</text>
    <text style="fill: #202a33; font: 7px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(188.80128 158.279717)">only</text>
   </g>
   <g id="text_12">
    <text style="fill: #202a33; font: 7px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start" x="369.82656" y="154.692681" transform="rotate(-0 369.82656 154.692681)">Mechanism unresolved</text>
   </g>
   <g id="text_13">
    <text style="fill: #202a33; font: 7px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(20.3472 186.755823)">Direct realized-state input →</text>
    <text style="fill: #202a33; font: 7px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(20.3472 194.007221)">artificial utility</text>
   </g>
   <g id="text_14">
    <text style="fill: #202a33; font: 7px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(188.80128 186.847533)">M2: no AcRKN advantage; generic references</text>
    <text style="fill: #202a33; font: 7px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(188.80128 194.082854)">had lower MSE</text>
   </g>
   <g id="text_15">
    <text style="fill: #202a33; font: 7px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start" x="369.82656" y="190.426366" transform="rotate(-0 369.82656 190.426366)">One synthetic plant/task</text>
   </g>
   <g id="text_16">
    <text style="fill: #202a33; font: 7px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(20.3472 222.528335)">Preserved temporal information →</text>
    <text style="fill: #202a33; font: 7px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(20.3472 229.779733)">artificial utility</text>
   </g>
   <g id="text_17">
    <text style="fill: #202a33; font: 7px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(188.80128 222.487319)">M5: local-rule correspondence effect; generic</text>
    <text style="fill: #202a33; font: 7px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(188.80128 229.820749)">ridge and replay effects were larger</text>
   </g>
   <g id="text_18">
    <text style="fill: #202a33; font: 7px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start" x="369.82656" y="226.156222" transform="rotate(-0 369.82656 226.156222)">One synthetic generator/task</text>
   </g>
   <g id="text_19">
    <text style="fill: #202a33; font: 7px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(20.3472 258.348261)">General transfer requirement or</text>
    <text style="fill: #202a33; font: 7px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(20.3472 265.50155)">law</text>
   </g>
   <g id="text_20">
    <text style="fill: #202a33; font: 7px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start" x="188.80128" y="261.88389" transform="rotate(-0 188.80128 261.88389)">Not established by either portfolio</text>
   </g>
   <g id="text_21">
    <text style="fill: #202a33; font: 7px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(369.82656 258.305605)">Retrospective evidence</text>
    <text style="fill: #202a33; font: 7px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(369.82656 265.458894)">proposal</text>
   </g>
   <g id="text_22">
    <text style="fill: #b64c4c; font: 700 7px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(20.3472 299.769066)">M2 and M5 have different endpoints and independent units; no cross-task effect is calculated.</text>
    <text style="fill: #b64c4c; font: 700 7px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(20.3472 307.163034)">The ordering is an editorial evidence map, not a validated hierarchy, scale or causal chain.</text>
   </g>
  </g>
  <g id="text_23">
   <text style="font: 700 11px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start" x="15.552" y="16.243594" transform="rotate(-0 15.552 16.243594)">Evidence map: what is supported, blocked or unresolved</text>
  </g>
 </g>
